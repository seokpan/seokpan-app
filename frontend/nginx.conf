# SPA 전제 fallback 설정 - 클라이언트 사이드 라우팅 미사용 확인 시 try_files 라인만 단순화 가능
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
