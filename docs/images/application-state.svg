<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc"><title id="title">애플리케이션 요청과 상태 저장</title><desc id="desc">브라우저의 변경 요청은 HTTP로, 화면 갱신은 WebSocket으로 전달된다. 백엔드 두 Replica가 MariaDB와 Redis를 공유한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60738e"/></marker></defs><rect width="1000" height="690" rx="18" fill="#f7f9fc"/><text x="32" y="45" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="27" font-weight="700" fill="#14253f">애플리케이션 요청과 상태 저장</text><text x="32" y="75" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#435570">브라우저 → API → 공통 저장소</text><path d="M 500 180 V 210 H 260 V 234" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 500 210 H 740 V 234" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 260 348 V 380 H 500 V 406" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 740 348 V 380 H 500" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round"/><path d="M 600 406 V 392 H 758 V 359" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 500 506 V 530 H 245 V 553" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 500 530 H 760 V 553" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="285" y="104" width="430" height="76" rx="12" fill="#ffffff" stroke="#c5d2e4"/><rect x="285" y="118" width="4" height="28" rx="2" fill="#2563eb"/><text x="303" y="136" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="19" font-weight="700" fill="#2563eb">브라우저 · React</text><text x="303" y="164" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#263a54">화면 요청 · 상태 변경 · 실시간 갱신</text><rect x="32" y="234" width="456" height="114" rx="12" fill="#ffffff" stroke="#c5d2e4"/><rect x="32" y="248" width="4" height="28" rx="2" fill="#2563eb"/><text x="50" y="266" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="19" font-weight="700" fill="#2563eb">HTTP  /api/v1</text><text x="50" y="294" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#263a54">상태 변경 · 조회</text><text x="50" y="318" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#263a54">변경 요청: 세션 · CSRF · 버전 검증</text><rect x="512" y="234" width="456" height="114" rx="12" fill="#ffffff" stroke="#c5d2e4"/><rect x="512" y="248" width="4" height="28" rx="2" fill="#2563eb"/><text x="530" y="266" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="19" font-weight="700" fill="#2563eb">WebSocket  /ws/v1</text><text x="530" y="294" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#263a54">Snapshot · Event 전달</text><text x="530" y="318" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#263a54">상태 변경 RPC에는 사용하지 않음</text><rect x="285" y="406" width="430" height="100" rx="12" fill="#ffffff" stroke="#c5d2e4"/><rect x="285" y="420" width="4" height="28" rx="2" fill="#2563eb"/><text x="303" y="438" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="19" font-weight="700" fill="#2563eb">FastAPI · 백엔드 2개 Replica</text><text x="303" y="466" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#263a54">같은 저장소를 사용하는 API 처리</text><rect x="32" y="553" width="456" height="105" 