<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="612" viewBox="0 0 1000 612" role="img" aria-labelledby="title desc"><title id="title">애플리케이션 요청과 상태 저장</title><desc id="desc">브라우저의 변경 요청은 HTTP로, 화면 갱신은 WebSocket으로 전달된다. 백엔드 두 Replica가 MariaDB와 Redis를 공유한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60738e"/></marker></defs><rect width="1000" height="612" rx="16" fill="#f8fafc"/><text x="32" y="45" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="27" font-weight="700" fill="#14253f">애플리케이션 요청과 상태 저장</text><text x="32" y="75" font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif" font-size="15" font-weight="400" fill="#435570">브라우저 → API → 공통 저장소</text><path d="M 460 178 V 199 H 260 V 222" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 540 178 V 199 H 740 V 222" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 260 320 V 344 H 430 V 365" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 585 365 V 344 H 740 V 320" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 465 443 V 473 H 260 V 499" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 535 443 V 473 H 740 V 499" fill="none" stroke="#60738e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="285" y="103" width="430" height="75" rx="10" fill="#ffffff" stroke="#cad5e3"/><rect x="285" y="118" width="4" height="21" rx="2" fill="#2563eb"/><text x="303" y="135" font-family="Arial,'Noto Sans CJK KR','Malgun 